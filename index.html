<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта RPM</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2336c5f4' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="map"></div>

    <button id="theme-toggle" type="button"></button>
    <div id="map-error" hidden>Не удалось загрузить карту</div>
    <div id="editor-panel" hidden></div>
    <aside id="note" hidden aria-label="Памятка о точке"></aside>

    <nav id="strip" aria-label="Зоны карты"></nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/geo.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/datafile.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
